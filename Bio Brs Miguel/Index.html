<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Bio Brs Miguel</title>

</head>

<body>

<!-- FUNDO -->
<div class="background"></div>
<div class="borda"></div>

<!-- AVISO MOBILE -->
<div id="rotate-warning">
  <p>Gire o dispositivo</p>
</div>

<div class="layout">

  <!-- MENU -->
  <aside class="menu">
    <h2>★ MENU</h2>
<button class="menu-btn" onclick="trocar('status')">BIOGRAFIA</button>

  <!-- CONTEÚDO -->

      <div class="card">

      <p>Idade: XX</p>
      <p> Faculdade/escola e objetivos</p>
      </div>

  <ul>
        <li>C#</li>
        <li>Pixel Art</li>
        <li>Documentação de jogos</li>
  </ul>

    <section id="itens" class="tela">
      <div class="card">
      <h2>FERRAMENTAS</h2>
  <ul>
        <li>Vs code, unity etc.</li>
  </ul>
        </div>

    </section>

    <section id="opcoes" class="tela">
      <div class="card">

      <h2>Contato e Redes</h2>
      <a href="https://github.com/MiguelAugustoP" target="_blank">Github</a>
      <a href="https://www.instagram.com/miguel_aug_p/" target="_blank">Instagram</a>
      <a href="https://www.linkedin.com/in/miguel-augusto-pereira-a05a30305/" target="_blank">linkedin </a>
      <a href="https://migzim23.itch.io/" target="_blank">Itch.io</a>
      </div>

    </section>

  </main>

  <!-- PERSONAGEM -->
  <div class="personagem">
<video autoplay loop muted playsinline class="char-video">
  <source src="BRS.mp4" type="video/mp4">
</video>
  </div>

</div>

<audio id="bgm" src="fuji-forest-bgm.mp3" loop></audio>
<audio id="select" src="select.mp3"></audio>
<audio id="confirm" src="confirm.mp3"></audio>

<script src="script.js"></script>
